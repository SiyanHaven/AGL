# AGL project config (case: declaring stdlib dependencies)

[project]
name = "stdlib_ok_en"
version = "0.1.0"
entry = "main.agl"
language = "en"

[build]
backend = "python"
out_dir = "build"
ir_dir = "build/ir"
diff_dir = "build/diff"

[dependencies]
math = "0.1.0"
list_util = "0.1.0"

[tool]

[sandbox]
max_duration_sec = 60
max_memory_mb = 512
max_loop_iterations = 10000
