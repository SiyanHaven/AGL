# AGL 用例期望表
# ══════════════════════════════════════════════════════════════════════
# 这份表是 **验收标准的机器可读形式**：`aglc doctor` 会逐条跑，
# 报出的错误码必须与这里一致，否则体检失败。
#
# stage = "compile"  期望在编译期报错（check 阶段）
# stage = "run"      期望编译通过，但运行期报错
# stage = "ok"       期望完全正常（编译通过 + 运行成功）
# ══════════════════════════════════════════════════════════════════════

[[case]]
file = "err_no_lang.agl"
stage = "compile"
code = "AGL-E-0101"
why = "首行缺语言声明"

[[case]]
file = "err_mixed.agl"
stage = "compile"
code = "AGL-E-0102"
why = "中文分支里出现英文关键字"

[[case]]
file = "err_syntax_unclosed.agl"
stage = "compile"
code = "AGL-E-0202"
why = "缺右花括号"

[[case]]
file = "err_undefined.agl"
stage = "compile"
code = "AGL-E-0302"
why = "使用了未声明的名字"

[[case]]
file = "err_effect.agl"
stage = "compile"
code = "AGL-E-0401"
why = "纯函数调用了带效应的函数"

[[case]]
file = "rt_divzero.agl"
stage = "run"
code = "AGL-RT-0010"
why = "除零，且必须回译到 AGL 行号"

[[case]]
file = "rt_null_member.agl"
stage = "run"
code = "AGL-RT-0007"
why = "空值读成员，且必须回译到 AGL 行号"

# ── 模块错误：导入相关的四条硬规则 ────────────────────────────────────
[[case]]
file = "mod_err/err_missing_module.agl"
stage = "compile"
code = "AGL-E-0601"
why = "导入的模块文件不存在"

[[case]]
file = "mod_err/循环甲.agl"
stage = "compile"
code = "AGL-E-0602"
why = "循环导入必须在编译期拒绝"

[[case]]
file = "mod_err/err_private.agl"
stage = "compile"
code = "AGL-E-0603"
why = "没有导出标记的函数，外部不能调用"

[[case]]
file = "mod_err/err_no_member.agl"
stage = "compile"
code = "AGL-E-0604"
why = "目标模块里没有这个名字"

[[case]]
file = "mod_err/rt_cross/rt_cross.agl"
stage = "run"
code = "AGL-RT-0010"
why = "错误发生在被导入的模块里，必须指回该文件的行号而不是入口文件"

[[case]]
file = "rt_no_member.agl"
stage = "run"
code = "AGL-RT-0008"
why = "文本上读不存在的成员：是「没有这个成员」，不是「值是空」"

# ── 语言层修复新增（v0.14）：转义 / 入口签名 / 类型名 / 任务参数 ────────
[[case]]
file = "err_escape.agl"
stage = "compile"
code = "AGL-E-0107"
why = "字符串里的未知转义必须报错，不能静默吞反斜杠"

[[case]]
file = "err_entry_params.agl"
stage = "compile"
code = "AGL-E-0313"
why = "入口函数没有调用方，不能带参数"

[[case]]
file = "err_bad_type.agl"
stage = "compile"
