why = "类型注解里出现表外类型名必须报错，不能静默当自定义类型"

[[case]]
file = "err_task_arg.agl"
stage = "compile"
code = "AGL-E-0315"
why = "任务() 只能提交异步调用，传普通值报错"

# ── 语言层收尾（v0.14 晚）：保留字 / 行中分号 / 跨类别等于 ─────────────
