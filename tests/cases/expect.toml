[[case]]
file = "err_chain_cmp.agl"
stage = "compile"
code = "AGL-E-0316"
why = "链式比较左结合成 真假<数字（Bool×数字比大小），编译期拒绝防错值（v0.17-主审）"

[[case]]
file = "err_dep_bad_version.agl"
stage = "compile"
code = "AGL-E-0605"
why = "依赖块版本号不是 major.minor.patch"

[[case]]
file = "err_dep_dup.agl"
stage = "compile"
code = "AGL-E-0307"
why = "同一个依赖包声明了两次"

[[case]]
file = "dep_cfg/missing.agl"
stage = "compile"
code = "AGL-E-0605"
why = "源码 依赖 块声明了包，agl.toml [dependencies] 里没有"

[[case]]
