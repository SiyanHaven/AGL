summary_zh = "清空容器：按实参类型返回空容器（列表 → `[]`、映射表 → 建映射()、集合 → 建集合()），与 Python `x.clear()` 语义一致（Python 原地清空返回 None，AGL 值语义返回新空容器）"
summary_en = "empty a container by type: list 鈫?[], map 鈫?{}, set 鈫?set(); like `x.clear()` (Python mutates & returns None, AGL value semantics)"
example = '变量 xs = 清空([10, 20])'

