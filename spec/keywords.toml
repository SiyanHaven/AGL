# AGL 关键字表 v0.53.0
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# 本文件是 **M1 词法分析器的唯一输入源**，也是中英双分支转换（aglc convert）
# 的唯一对照表。任何关键字增删改，必须先改本文件，再改代码，并过全量用例回归。
#
# 来源：项目规划设计 §3.2（核心关键字表）/ §3.2.1（扩展关键字表）/ §3.15（运算符词）
# 冻结：2026-10-27；v0.31 重建：2026-10-29（编码事故后按 en 字段与语言知识逐项恢复，
#       并新增 清空/按格式/表达式形式 三个内建与科学计数法字面量）
#
# stage 字段含义：
#   1 = 阶段 1（M0–M6）必须支持
#   2 = 阶段 2 启用（M1 阶段词法器可不识别，识别了也无害）
#   3 = 阶段 3 启用
# kind 字段含义：
#   decl    = 声明类
#   stmt    = 语句类
#   type    = 类型
#   effect  = 效应标签
#   literal = 字面量
#   builtin = 内建值 / 入口
#   modifier= 修饰符

[meta]
version = "0.53.0"
frozen_at = "2026-11-02"
source = "项目规划设计 §3.2 / §3.2.1 / §3.15"
rule = "先改本表 → 再改代码 → 过全量回归。禁止代码里硬编码关键字。"

