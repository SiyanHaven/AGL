opt = 1
ret = "列表"
effect = ""
needs_await = false
lower = "_agl_pop"
summary_zh = "弹出元素：列表无参弹尾部、带下标弹该位，返回 `[值, 新列表]`；映射表弹键返回 `[值, 新映射]`"
summary_en = "pop an element: returns [value, new_container]; list `xs.pop([i])` (index defaults to tail), map `d.pop(k)` (missing key raises); auto-dispatch by argument type"
example = '变量 值, 新列表 = 弹出([10, 20, 30])'

